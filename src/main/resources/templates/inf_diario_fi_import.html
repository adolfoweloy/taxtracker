<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>
<head>
    <title>Import Investment Fund Daily Info</title>
    <link rel="stylesheet" th:href="@{/css/report.css}"/>
    <style>
        .group-shaded td { background-color: #f8f9fa; }
    </style>
</head>
<body>
<section class="section" layout:fragment="page-content">
    <h1 class="section-title">Import Investment Fund Daily Info</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form id="import-form" method="POST" th:action="@{/import/inf-diario-fi}" enctype="multipart/form-data" class="mb-4">
        <input type="hidden" id="cnpjs-input" name="cnpjs"/>

        <div class="mb-3">
            <label class="form-label mb-1">Select Funds</label>
            <div th:if="${#lists.isEmpty(funds)}" class="text-muted">
                No funds registered. <a th:href="@{/settings/vgbl-funds}">Add funds first.</a>
            </div>
            <div class="form-check" th:each="fund : ${funds}">
                <input class="form-check-input fund-checkbox" type="checkbox"
                       th:value="${fund.cnpj}" th:id="'fund-' + ${fund.cnpj}"
                       th:checked="${fund.hasQuotas}"/>
                <label class="form-check-label" th:for="'fund-' + ${fund.cnpj}"
                       th:text="${fund.fundName + ' (' + fund.cnpj + ')'}"></label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label mb-1">CVM CSV File</label>
            <p class="text-muted small mb-1">Download the daily fund data CSV from one of the sources below:</p>
            <ul class="list-unstyled small mb-2">
                <li><i class="fa-solid fa-link me-1"></i><a href="https://dados.cvm.gov.br/dados/FI/DOC/INF_DIARIO/DADOS/" target="_blank">dados.cvm.gov.br — Daily fund data files</a></li>
                <li><i class="fa-solid fa-link me-1"></i><a href="https://dados.cvm.gov.br/dataset/fi-doc-inf_diario" target="_blank">dados.cvm.gov.br — Dataset documentation</a></li>
            </ul>
        </div>

        <div class="d-flex align-items-end gap-3">
            <div>
                <input type="file" id="file-input" name="file" class="form-control" accept=".csv" required/>
            </div>
            <div>
                <label class="form-label mb-1">&nbsp;</label>
                <button type="submit" class="btn btn-primary d-block">Import</button>
            </div>
        </div>
    </form>

    <script>
        document.getElementById('import-form').addEventListener('submit', function (e) {
            var checkboxes = document.querySelectorAll('.fund-checkbox:checked');
            if (checkboxes.length === 0) {
                e.preventDefault();
                alert('Please select at least one fund.');
                return;
            }
            var cnpjs = Array.prototype.map.call(checkboxes, function (cb) { return cb.value; });
            document.getElementById('cnpjs-input').value = cnpjs.join(',');
        });
    </script>
</section>
</body>
</html>
